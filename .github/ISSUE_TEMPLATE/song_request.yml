name: Pedir un tango
description: Un tango, vals o milonga que no está en el índice.
labels: [song request]
body:
  - type: input
    id: title
    attributes:
      label: Título
      placeholder: Gricel
    validations:
      required: true
  - type: input
    id: authors
    attributes:
      label: Autor y letrista
      description: Si los conoce.
      placeholder: M. Mores, J. M. Contursi
  - type: textarea
    id: notes
    attributes:
      label: Algo más
      description: Una versión de referencia, o dónde encontrar la partitura.
