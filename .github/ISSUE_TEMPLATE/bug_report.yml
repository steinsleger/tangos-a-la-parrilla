name: Reportar un error
description: Algo no funciona, o hay un error en una partitura.
labels: [bug]
body:
  - type: input
    id: song
    attributes:
      label: Tango
      description: Si el error está en una partitura, ¿en cuál?
      placeholder: Volver
  - type: input
    id: link
    attributes:
      label: Enlace
      description: Pegue la dirección de la página. Incluye el tono que estaba viendo.
  - type: textarea
    id: description
    attributes:
      label: ¿Qué ocurrió?
      description: Si se trata de una nota, un acorde o un texto, indique en qué compás está.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Dispositivo y navegador
      placeholder: iPhone, Safari
